<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 20 584 448" fill="none" role="img" aria-labelledby="t">
  <title id="t">Portafolio académico en el navegador con documentos PDF e imágenes</title>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0E7490" flood-opacity="0.18"/>
    </filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B2530" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFFAFE"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#0E7490" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- Formas de fondo -->
  <circle cx="490" cy="120" r="96" fill="#FB7185" opacity="0.13"/>
  <circle cx="100" cy="386" r="68" fill="#0E7490" opacity="0.09"/>
  <rect x="440" y="350" width="140" height="112" fill="url(#dots)"/>
  <rect x="24" y="40" width="98" height="84" fill="url(#dots)"/>

  <!-- Ventana del navegador -->
  <g filter="url(#sh)">
    <rect x="70" y="56" width="440" height="352" rx="18" fill="#FFFFFF"/>
  </g>
  <path d="M70 74a18 18 0 0 1 18-18h404a18 18 0 0 1 18 18v22H70z" fill="#F1F5F9"/>
  <circle cx="94" cy="77" r="5" fill="#FB7185"/>
  <circle cx="111" cy="77" r="5" fill="#CBD5E1"/>
  <circle cx="128" cy="77" r="5" fill="#CBD5E1"/>
  <rect x="160" y="67" width="236" height="20" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="173" cy="77" r="3.2" fill="#0E7490"/>
  <text x="183" y="81" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0E7490">portafolio-academico.app/p/ana-torres</text>

  <!-- Cabecera del portafolio -->
  <rect x="86" y="110" width="408" height="88" rx="12" fill="url(#hdr)"/>
  <circle cx="128" cy="154" r="24" fill="#ECFEFF"/>
  <circle cx="128" cy="147" r="8" fill="#0E7490"/>
  <path d="M114 167c2-8 8-11 14-11s12 3 14 11" fill="#0E7490"/>
  <rect x="164" y="138" width="156" height="13" rx="6.5" fill="#ECFEFF"/>
  <rect x="164" y="159" width="104" height="8" rx="4" fill="#ECFEFF" opacity="0.6"/>
  <rect x="404" y="140" width="72" height="26" rx="13" fill="#FB7185"/>
  <rect x="418" y="150.5" width="44" height="5" rx="2.5" fill="#FFFFFF"/>

  <!-- Pestañas (apartados) -->
  <rect x="92" y="214" width="56" height="9" rx="4.5" fill="#0E7490"/>
  <rect x="166" y="214" width="62" height="9" rx="4.5" fill="#CBD5E1"/>
  <rect x="246" y="214" width="48" height="9" rx="4.5" fill="#CBD5E1"/>
  <rect x="92" y="229" width="56" height="3.5" rx="1.75" fill="#FB7185"/>
  <path d="M86 240h408" stroke="#E2E8F0"/>

  <!-- Tarjeta: documento PDF -->
  <rect x="86" y="254" width="198" height="136" rx="12" fill="#ECFEFF" stroke="#CFFAFE"/>
  <path d="M102 270h26l10 10v36a5 5 0 0 1-5 5h-31a5 5 0 0 1-5-5v-41a5 5 0 0 1 5-5z" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.6"/>
  <path d="M128 270v10h10" fill="none" stroke="#0E7490" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="103" y="295" width="28" height="13" rx="3" fill="#FB7185"/>
  <text x="107.5" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">PDF</text>
  <rect x="152" y="276" width="114" height="9" rx="4.5" fill="#0E7490" opacity="0.85"/>
  <rect x="152" y="292" width="84" height="7" rx="3.5" fill="#94A3B8" opacity="0.6"/>
  <rect x="102" y="334" width="164" height="6" rx="3" fill="#A5F3FC"/>
  <rect x="102" y="347" width="134" height="6" rx="3" fill="#A5F3FC"/>
  <rect x="102" y="364" width="66" height="14" rx="7" fill="#0E7490" opacity="0.14"/>

  <!-- Tarjeta: imágenes -->
  <rect x="296" y="254" width="198" height="136" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="310" y="268" width="82" height="66" rx="8" fill="url(#sky)"/>
  <circle cx="370" cy="286" r="7" fill="#FB7185"/>
  <path d="M310 324l22-24 16 16 12-10 32 26v2a8 8 0 0 1-8 8h-66a8 8 0 0 1-8-8z" fill="#0E7490" opacity="0.55"/>
  <rect x="398" y="268" width="82" height="66" rx="8" fill="#FFF1F2"/>
  <rect x="410" y="306" width="10" height="20" rx="2" fill="#FB7185"/>
  <rect x="426" y="294" width="10" height="32" rx="2" fill="#0E7490"/>
  <rect x="442" y="286" width="10" height="40" rx="2" fill="#FB7185" opacity="0.7"/>
  <rect x="458" y="300" width="10" height="26" rx="2" fill="#0E7490" opacity="0.6"/>
  <rect x="310" y="346" width="122" height="9" rx="4.5" fill="#0E7490" opacity="0.85"/>
  <rect x="310" y="362" width="88" height="7" rx="3.5" fill="#94A3B8" opacity="0.6"/>

  <!-- Tarjeta flotante: parcial -->
  <g filter="url(#sh2)">
    <rect x="22" y="352" width="200" height="68" rx="16" fill="#FFFFFF"/>
  </g>
  <circle cx="58" cy="386" r="18" fill="#ECFEFF"/>
  <path d="M50 386.5l5.5 5.5 11-11.5" stroke="#0E7490" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="86" y="381" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0B2530">Parcial 2</text>
  <text x="86" y="399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748B">4 publicaciones</text>

  <!-- Insignia flotante: birrete -->
  <g filter="url(#sh2)">
    <circle cx="512" cy="64" r="36" fill="#FFFFFF"/>
  </g>
  <path d="M512 47l20 9.2-20 9.2-20-9.2z" fill="#0E7490"/>
  <path d="M500.5 61.3v6.6c0 2.5 5.2 4.6 11.5 4.6s11.5-2.1 11.5-4.6v-6.6L512 66.5z" fill="#0E7490" opacity="0.85"/>
  <path d="M532 56.2v11" stroke="#FB7185" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="532" cy="69.6" r="3" fill="#FB7185"/>

  <!-- Píldora flotante: archivo -->
  <g filter="url(#sh2)">
    <rect x="452" y="214" width="132" height="44" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="476" cy="236" r="12" fill="#FFE4E6"/>
  <path d="M471 230.5h7l3.5 3.5v8a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.5-1.5v-10a1.5 1.5 0 0 1 1.5-1.5z" fill="none" stroke="#E11D48" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="496" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0B2530">PDF · 2,4 MB</text>
</svg>
